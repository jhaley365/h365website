<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2a86"/>
      <stop offset="0.55" stop-color="#a1327e"/>
      <stop offset="1" stop-color="#e8734a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="420" fill="url(#bg1)"/>
  <rect width="640" height="420" fill="url(#glow1)"/>

  <!-- twinkles -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="60" cy="55" r="2.4"/>
    <circle cx="120" cy="110" r="1.6"/>
    <circle cx="560" cy="60" r="2.2"/>
    <circle cx="600" cy="130" r="1.6"/>
    <circle cx="500" cy="40" r="1.4"/>
    <circle cx="40" cy="200" r="1.6"/>
    <circle cx="580" cy="220" r="1.8"/>
  </g>

  <!-- confetti -->
  <g opacity="0.9">
    <rect x="70" y="150" width="10" height="4" rx="1" fill="#ffd166" transform="rotate(20 75 152)"/>
    <rect x="540" y="170" width="10" height="4" rx="1" fill="#06d6a0" transform="rotate(-15 545 172)"/>
    <rect x="90" y="260" width="9" height="4" rx="1" fill="#ef476f" transform="rotate(35 95 262)"/>
    <rect x="520" y="270" width="10" height="4" rx="1" fill="#ffd166" transform="rotate(-25 525 272)"/>
    <circle cx="150" cy="90" r="4" fill="#06d6a0"/>
    <circle cx="470" cy="100" r="4" fill="#ef476f"/>
    <circle cx="170" cy="320" r="4" fill="#ffd166"/>
    <circle cx="460" cy="330" r="4" fill="#118ab2"/>
  </g>

  <!-- left balloon -->
  <g>
    <line x1="130" y1="185" x2="115" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <ellipse cx="130" cy="145" rx="42" ry="52" fill="#ef476f"/>
    <ellipse cx="118" cy="120" rx="12" ry="18" fill="#ffffff" opacity="0.25"/>
    <path d="M 122 195 L 130 205 L 138 195 Z" fill="#ef476f"/>
  </g>

  <!-- right balloon -->
  <g>
    <line x1="510" y1="195" x2="524" y2="335" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <ellipse cx="510" cy="155" rx="40" ry="50" fill="#118ab2"/>
    <ellipse cx="498" cy="130" rx="11" ry="17" fill="#ffffff" opacity="0.25"/>
    <path d="M 502 203 L 510 213 L 518 203 Z" fill="#118ab2"/>
  </g>

  <!-- small yellow balloon -->
  <g>
    <line x1="205" y1="130" x2="215" y2="225" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <ellipse cx="205" cy="98" rx="26" ry="32" fill="#ffd166"/>
    <path d="M 199 128 L 205 135 L 211 128 Z" fill="#ffd166"/>
  </g>

  <!-- small green balloon -->
  <g>
    <line x1="435" y1="140" x2="425" y2="235" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <ellipse cx="435" cy="108" rx="24" ry="30" fill="#06d6a0"/>
    <path d="M 429 136 L 435 143 L 441 136 Z" fill="#06d6a0"/>
  </g>

  <!-- banner -->
  <g>
    <path d="M 195 60 L 445 60 L 460 85 L 445 110 L 195 110 L 180 85 Z" fill="#ffd166"/>
    <text x="320" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="30" fill="#5b2a86" text-anchor="middle">Happy Birthday</text>
  </g>

  <!-- table shadow -->
  <ellipse cx="320" cy="392" rx="150" ry="14" fill="#000000" opacity="0.18"/>

  <!-- cake plate -->
  <ellipse cx="320" cy="378" rx="130" ry="16" fill="#ffffff"/>
  <ellipse cx="320" cy="374" rx="130" ry="14" fill="#f4f4f6"/>

  <!-- cake tier 3 (bottom) -->
  <rect x="230" y="320" width="180" height="52" rx="8" fill="#ffe1ec"/>
  <rect x="230" y="320" width="180" height="14" rx="7" fill="#ffc4dc"/>

  <!-- cake tier 2 -->
  <rect x="255" y="270" width="130" height="52" rx="8" fill="#fff1d6"/>
  <rect x="255" y="270" width="130" height="14" rx="7" fill="#ffdf9e"/>

  <!-- cake tier 1 (top) -->
  <rect x="278" y="222" width="84" height="50" rx="8" fill="#d8f3ea"/>
  <rect x="278" y="222" width="84" height="14" rx="7" fill="#aee9d1"/>

  <!-- candles -->
  <g>
    <rect x="300" y="196" width="7" height="26" rx="2" fill="#ef476f"/>
    <rect x="317" y="190" width="7" height="32" rx="2" fill="#118ab2"/>
    <rect x="334" y="196" width="7" height="26" rx="2" fill="#ffd166"/>
    <ellipse cx="303.5" cy="192" rx="5" ry="8" fill="#ffb703"/>
    <ellipse cx="320.5" cy="185" rx="5" ry="8" fill="#ffb703"/>
    <ellipse cx="337.5" cy="192" rx="5" ry="8" fill="#ffb703"/>
  </g>

  <!-- sprinkles on cake -->
  <g fill="#ffffff">
    <circle cx="260" cy="345" r="3"/>
    <circle cx="290" cy="355" r="3"/>
    <circle cx="350" cy="348" r="3"/>
    <circle cx="380" cy="358" r="3"/>
    <circle cx="290" cy="295" r="3"/>
    <circle cx="340" cy="300" r="3"/>
  </g>
</svg>
