<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b2d8e"/>
      <stop offset="0.5" stop-color="#d84a7a"/>
      <stop offset="1" stop-color="#f2994a"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#bg4)"/>

  <!-- streamers -->
  <path d="M -10 20 C 60 60, 120 -10, 190 30" stroke="#ffd166" stroke-width="6" fill="none" opacity="0.85"/>
  <path d="M 460 10 C 520 50, 580 -10, 650 20" stroke="#06d6a0" stroke-width="6" fill="none" opacity="0.85"/>

  <!-- confetti -->
  <g opacity="0.9">
    <rect x="80" y="220" width="12" height="5" rx="1.5" fill="#ffffff" transform="rotate(20 86 222)"/>
    <rect x="540" y="230" width="12" height="5" rx="1.5" fill="#ffd166" transform="rotate(-20 546 232)"/>
    <circle cx="60" cy="300" r="5" fill="#06d6a0"/>
    <circle cx="580" cy="300" r="5" fill="#118ab2"/>
    <circle cx="120" cy="90" r="4" fill="#ffffff"/>
    <circle cx="520" cy="80" r="4" fill="#ffffff"/>
  </g>

  <!-- party hats trio -->
  <g>
    <path d="M 190 340 L 220 230 L 250 340 Z" fill="#118ab2"/>
    <circle cx="220" cy="230" r="8" fill="#ffd166"/>
    <rect x="190" y="325" width="60" height="10" fill="#ffffff" opacity="0.85"/>
  </g>
  <g>
    <path d="M 290 350 L 320 210 L 350 350 Z" fill="#ef476f"/>
    <circle cx="320" cy="210" r="9" fill="#ffd166"/>
    <rect x="288" y="333" width="64" height="11" fill="#ffffff" opacity="0.85"/>
  </g>
  <g>
    <path d="M 390 340 L 420 230 L 450 340 Z" fill="#06d6a0"/>
    <circle cx="420" cy="230" r="8" fill="#ffd166"/>
    <rect x="390" y="325" width="60" height="10" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- table shadow -->
  <ellipse cx="320" cy="392" rx="170" ry="14" fill="#000000" opacity="0.2"/>

  <text x="320" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">Let's Celebrate!</text>
  <text x="320" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="24" fill="#ffd166" text-anchor="middle">Happy Birthday</text>
</svg>
