<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="0.55" stop-color="#3d3d99"/>
      <stop offset="1" stop-color="#8a4fd1"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#bg2)"/>

  <!-- fireworks bursts -->
  <g stroke="#ffd166" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <g transform="translate(110,90)">
      <line x1="0" y1="-26" x2="0" y2="26"/>
      <line x1="-26" y1="0" x2="26" y2="0"/>
      <line x1="-18" y1="-18" x2="18" y2="18"/>
      <line x1="-18" y1="18" x2="18" y2="-18"/>
    </g>
    <g transform="translate(530,80) scale(0.8)" stroke="#06d6a0">
      <line x1="0" y1="-26" x2="0" y2="26"/>
      <line x1="-26" y1="0" x2="26" y2="0"/>
      <line x1="-18" y1="-18" x2="18" y2="18"/>
      <line x1="-18" y1="18" x2="18" y2="-18"/>
    </g>
    <g transform="translate(560,260) scale(0.6)" stroke="#ef476f">
      <line x1="0" y1="-26" x2="0" y2="26"/>
      <line x1="-26" y1="0" x2="26" y2="0"/>
      <line x1="-18" y1="-18" x2="18" y2="18"/>
      <line x1="-18" y1="18" x2="18" y2="-18"/>
    </g>
  </g>

  <!-- confetti scatter -->
  <g opacity="0.95">
    <rect x="70" y="180" width="12" height="5" rx="1.5" fill="#ffd166" transform="rotate(15 76 182)"/>
    <rect x="90" y="260" width="12" height="5" rx="1.5" fill="#06d6a0" transform="rotate(-20 96 262)"/>
    <rect x="550" y="180" width="12" height="5" rx="1.5" fill="#ef476f" transform="rotate(25 556 182)"/>
    <rect x="520" y="330" width="12" height="5" rx="1.5" fill="#118ab2" transform="rotate(-10 526 332)"/>
    <circle cx="60" cy="240" r="5" fill="#ef476f"/>
    <circle cx="580" cy="140" r="5" fill="#ffd166"/>
    <circle cx="150" cy="340" r="5" fill="#06d6a0"/>
    <circle cx="490" cy="360" r="5" fill="#f2f2f2"/>
    <circle cx="200" cy="60" r="4" fill="#ffffff"/>
    <circle cx="440" cy="55" r="4" fill="#ffffff"/>
  </g>

  <!-- streamers -->
  <path d="M 0 40 C 60 70, 90 10, 150 40" stroke="#ef476f" stroke-width="5" fill="none" opacity="0.85"/>
  <path d="M 490 30 C 550 60, 580 0, 640 30" stroke="#06d6a0" stroke-width="5" fill="none" opacity="0.85"/>

  <!-- table -->
  <ellipse cx="320" cy="392" rx="150" ry="14" fill="#000000" opacity="0.22"/>
  <ellipse cx="320" cy="378" rx="130" ry="16" fill="#ffffff"/>
  <ellipse cx="320" cy="374" rx="130" ry="14" fill="#eef0f7"/>

  <!-- cupcake wrapper -->
  <path d="M 250 300 L 390 300 L 370 372 L 270 372 Z" fill="#ffd166"/>
  <path d="M 250 300 L 390 300 L 384 320 L 256 320 Z" fill="#ffb703" opacity="0.6"/>

  <!-- cupcake frosting swirl -->
  <path d="M 250 300
           C 250 260, 280 240, 320 240
           C 360 240, 390 260, 390 300 Z" fill="#ffe1ec"/>
  <path d="M 265 300
           C 268 275, 292 258, 320 258
           C 348 258, 372 275, 375 300 Z" fill="#ffcfe0"/>
  <circle cx="320" cy="238" r="14" fill="#ffe1ec"/>

  <!-- candle -->
  <rect x="314" y="205" width="8" height="30" rx="2" fill="#118ab2"/>
  <ellipse cx="318" cy="200" rx="6" ry="9" fill="#ffb703"/>

  <!-- sprinkles -->
  <g fill="#ffffff">
    <circle cx="290" cy="280" r="2.6"/>
    <circle cx="310" cy="270" r="2.6"/>
    <circle cx="335" cy="275" r="2.6"/>
    <circle cx="350" cy="290" r="2.6"/>
    <circle cx="300" cy="295" r="2.6"/>
  </g>

  <text x="320" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">Happy Birthday!</text>
</svg>
