<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d5c"/>
      <stop offset="0.5" stop-color="#2e6f8e"/>
      <stop offset="1" stop-color="#6fb1c9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#bg3)"/>

  <!-- twinkles -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="70" r="2"/>
    <circle cx="560" cy="60" r="2.4"/>
    <circle cx="600" cy="150" r="1.6"/>
    <circle cx="40" cy="180" r="1.6"/>
    <circle cx="520" cy="30" r="1.4"/>
  </g>

  <!-- falling confetti -->
  <g opacity="0.9">
    <rect x="100" y="300" width="10" height="4" rx="1" fill="#ffd166" transform="rotate(20 105 302)"/>
    <rect x="520" y="310" width="10" height="4" rx="1" fill="#ef476f" transform="rotate(-15 525 312)"/>
    <circle cx="150" cy="250" r="4" fill="#06d6a0"/>
    <circle cx="490" cy="260" r="4" fill="#ffd166"/>
    <circle cx="60" cy="330" r="4" fill="#ef476f"/>
    <circle cx="580" cy="340" r="4" fill="#118ab2"/>
  </g>

  <!-- balloon strings -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.6" fill="none">
    <path d="M 260 190 C 250 260, 270 300, 300 360"/>
    <path d="M 320 175 C 320 250, 320 300, 320 365"/>
    <path d="M 380 190 C 390 260, 370 300, 340 360"/>
  </g>

  <!-- balloon cluster -->
  <ellipse cx="260" cy="140" rx="46" ry="56" fill="#ef476f"/>
  <ellipse cx="320" cy="120" rx="52" ry="64" fill="#ffd166"/>
  <ellipse cx="380" cy="140" rx="46" ry="56" fill="#06d6a0"/>
  <ellipse cx="245" cy="112" rx="12" ry="18" fill="#ffffff" opacity="0.25"/>
  <ellipse cx="305" cy="88" rx="14" ry="20" fill="#ffffff" opacity="0.25"/>
  <ellipse cx="365" cy="112" rx="12" ry="18" fill="#ffffff" opacity="0.25"/>

  <!-- knot -->
  <path d="M 312 182 L 320 194 L 328 182 Z" fill="#ffd166"/>

  <!-- table -->
  <ellipse cx="320" cy="392" rx="150" ry="14" fill="#000000" opacity="0.2"/>

  <!-- gift box -->
  <rect x="255" y="330" width="130" height="55" rx="6" fill="#8a4fd1"/>
  <rect x="255" y="352" width="130" height="14" fill="#7238c0"/>
  <rect x="310" y="330" width="20" height="55" fill="#ffd166"/>
  <path d="M 300 330 C 292 310, 275 312, 278 328 C 265 322, 260 336, 275 336 Z" fill="#ffd166"/>
  <path d="M 340 330 C 348 310, 365 312, 362 328 C 375 322, 380 336, 365 336 Z" fill="#ffd166"/>

  <text x="320" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="32" fill="#ffffff" text-anchor="middle">Happy Birthday!</text>
</svg>
